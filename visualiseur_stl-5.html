<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Visualiseur STL 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg: #0b0d10;
    --panel: #14171c;
    --line: #262b33;
    --accent: #4fd1c5;
    --text: #e8ecef;
    --muted: #8a93a1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }

  #viewer { flex: 1; position: relative; touch-action: none; min-height: 200px; }
  #viewer canvas { display: block; width: 100%; height: 100%; }

  #placeholder {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; text-align: center; padding: 30px;
  }
  #placeholder .icon { font-size: 34px; opacity: 0.5; }
  #placeholder p { color: var(--muted); font-size: 13px; max-width: 260px; line-height: 1.5; margin: 0; }

  #hint {
    position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
    font-size: 11px; color: var(--muted); pointer-events: none; opacity: 0.8;
  }

  footer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  }

  /* Bouton principal = un vrai <label for="fileInput">.
     C'est le navigateur lui-même qui ouvre le sélecteur de fichiers natif :
     pas de JS requis pour déclencher l'action, donc rien qui puisse être bloqué. */
  .btn {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--accent);
    color: #06201d;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:active { opacity: 0.75; }

  #fileInput {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0; padding: 0; margin: -1px;
  }

  #status { font-size: 12px; color: var(--muted); padding-top: 10px; text-align: center; min-height: 14px; }
  #status.error { color: #f28b82; }
  #status.ok { color: var(--accent); }

  #handPreview {
    position: absolute; top: 10px; right: 10px;
    width: 90px; height: 68px; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--line); opacity: 0; transition: opacity 0.2s;
    background: #000;
  }
  #handPreview.on { opacity: 1; }
  #handPreview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #handStatus {
    position: absolute; top: 82px; right: 10px; font-size: 10px; padding: 3px 6px;
    border-radius: 6px; background: rgba(0,0,0,0.5); color: var(--muted); opacity: 0;
  }
  #handStatus.on { opacity: 1; }
  #handStatus.found { color: var(--accent); }

  .btn.secondary { background: #1b1f26; color: var(--text); margin-top: 8px; }
</style>
</head>
<body>
<div id="app">

  <div id="viewer">
    <div id="placeholder">
      <div class="icon">◇</div>
      <p>Aucun modèle chargé.<br>Touche le bouton en bas pour choisir un fichier .stl sur ton téléphone.</p>
    </div>
    <div id="hint" style="display:none;">Glisse pour tourner l'objet · pince pour zoomer</div>
    <div id="handPreview"><video id="handVideo" autoplay playsinline muted></video></div>
    <div id="handStatus">Recherche d'une main...</div>
  </div>

  <footer>
    <label class="btn" for="fileInput">📂 Choisir un fichier .stl</label>
    <input type="file" id="fileInput" accept=".stl,application/sla,application/vnd.ms-pki.stl,model/stl,*/*">
    <button class="btn secondary" id="handToggleBtn">🖐️ Activer le suivi de la main</button>
    <div id="status"></div>
  </footer>

</div>

<script>
(function(){
  const viewerEl = document.getElementById('viewer');
  const placeholder = document.getElementById('placeholder');
  const hint = document.getElementById('hint');
  const statusEl = document.getElementById('status');
  const fileInput = document.getElementById('fileInput');

  function setStatus(msg, kind){
    statusEl.textContent = msg || '';
    statusEl.className = kind || '';
  }

  // Confirme tout de suite que le JS tourne bien, pour écarter ce doute en cas de souci.
  setStatus('Prêt. En attente d\'un fichier.');

  // ---------- Three.js ----------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 5000);
  camera.position.set(0, 0, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  viewerEl.appendChild(renderer.domElement);

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
  keyLight.position.set(3, 5, 4);
  scene.add(keyLight);
  const fill = new THREE.DirectionalLight(0xffffff, 0.4);
  fill.position.set(-4, -2, -3);
  scene.add(fill);
  scene.add(new THREE.AmbientLight(0x404040, 1.2));

  // Pivot = objet qui sera piloté plus tard par la détection de la main.
  const pivot = new THREE.Group();
  scene.add(pivot);
  let currentMesh = null;

  function resize(){
    const w = viewerEl.clientWidth, h = viewerEl.clientHeight;
    if (w === 0 || h === 0) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  if (window.ResizeObserver) {
    new ResizeObserver(resize).observe(viewerEl);
  }
  resize();
  // Le canevas peut valoir 0x0 à l'ouverture avant que la mise en page mobile
  // se stabilise (barre d'adresse, safe-area...) : on retente à plusieurs reprises.
  [50, 150, 300, 600, 1000].forEach(t => setTimeout(resize, t));

  function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  // Rotation tactile / souris (en attendant le tracking de la main)
  let dragging = false, lastX = 0, lastY = 0, pinchDist = null;

  function down(x, y){ dragging = true; lastX = x; lastY = y; }
  function move(x, y){
    if (!dragging) return;
    pivot.rotation.y += (x - lastX) * 0.008;
    pivot.rotation.x += (y - lastY) * 0.008;
    lastX = x; lastY = y;
  }
  viewerEl.addEventListener('mousedown', e => down(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
  window.addEventListener('mouseup', () => dragging = false);

  viewerEl.addEventListener('touchstart', e => {
    if (e.touches.length === 1) down(e.touches[0].clientX, e.touches[0].clientY);
    else if (e.touches.length === 2) pinchDist = dist(e.touches);
  }, { passive: true });
  viewerEl.addEventListener('touchmove', e => {
    if (e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY);
    else if (e.touches.length === 2) {
      const d = dist(e.touches);
      if (pinchDist) camera.position.z = Math.max(0.5, camera.position.z - (d - pinchDist) * 0.01);
      pinchDist = d;
    }
  }, { passive: true });
  viewerEl.addEventListener('touchend', () => { dragging = false; pinchDist = null; });
  function dist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }

  // Points d'entrée pour le futur module de détection de la main.
  window.setModelRotation = (x, y) => { pivot.rotation.x = x; pivot.rotation.y = y; };
  window.nudgeModelRotation = (dx, dy) => { pivot.rotation.x += dx; pivot.rotation.y += dy; };
  window.setModelZoom = z => { camera.position.z = Math.max(0.3, z); };

  // ---------- Parseur STL maison (binaire + ASCII) ----------
  function parseSTL(buffer){
    return detectAscii(buffer) ? parseAscii(buffer) : parseBinary(buffer);
  }
  function detectAscii(buffer){
    if (buffer.byteLength < 84) return true;
    const dv = new DataView(buffer);
    const triCount = dv.getUint32(80, true);
    const expectedBinarySize = 84 + triCount * 50;
    // Correspondance exacte de taille => quasi certain que c'est du binaire,
    // même si l'entête contient le mot "solid" (fréquent avec certains exports CAO).
    if (expectedBinarySize === buffer.byteLength) return false;
    // Sinon on regarde si le contenu ressemble à du texte lisible (ASCII STL).
    const sample = new Uint8Array(buffer, 0, Math.min(buffer.byteLength, 4096));
    let printable = 0;
    for (let i = 0; i < sample.length; i++){
      const c = sample[i];
      if (c === 9 || c === 10 || c === 13 || (c >= 32 && c <= 126)) printable++;
    }
    return (printable / sample.length) > 0.95;
  }
  function parseBinary(buffer){
    const dv = new DataView(buffer);
    const triCount = dv.getUint32(80, true);
    const positions = new Float32Array(triCount * 9);
    const normals = new Float32Array(triCount * 9);
    let o = 84;
    for (let i = 0; i < triCount; i++){
      const nx = dv.getFloat32(o, true), ny = dv.getFloat32(o+4, true), nz = dv.getFloat32(o+8, true);
      o += 12;
      for (let v = 0; v < 3; v++){
        const idx = i*9 + v*3;
        positions[idx] = dv.getFloat32(o, true);
        positions[idx+1] = dv.getFloat32(o+4, true);
        positions[idx+2] = dv.getFloat32(o+8, true);
        normals[idx]=nx; normals[idx+1]=ny; normals[idx+2]=nz;
        o += 12;
      }
      o += 2;
    }
    return build(positions, normals);
  }
  function parseAscii(buffer){
    const text = new TextDecoder().decode(buffer);
    const re = /vertex\s+([\-0-9.eE]+)\s+([\-0-9.eE]+)\s+([\-0-9.eE]+)/g;
    const positions = [];
    let m;
    while ((m = re.exec(text)) !== null) positions.push(+m[1], +m[2], +m[3]);
    return build(new Float32Array(positions), null);
  }
  function build(positions, normals){
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    if (normals) geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    else geo.computeVertexNormals();
    return geo;
  }

  function displayGeometry(geometry){
    if (currentMesh){
      pivot.remove(currentMesh);
      currentMesh.geometry.dispose();
      currentMesh.material.dispose();
    }
    geometry.computeBoundingBox();
    const center = new THREE.Vector3();
    geometry.boundingBox.getCenter(center);
    geometry.translate(-center.x, -center.y, -center.z);

    const size = new THREE.Vector3();
    geometry.boundingBox.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const scale = 2 / maxDim;
    geometry.scale(scale, scale, scale);

    const material = new THREE.MeshStandardMaterial({ color: 0x4fd1c5, metalness: 0.15, roughness: 0.55, side: THREE.DoubleSide });
    currentMesh = new THREE.Mesh(geometry, material);
    pivot.add(currentMesh);
    pivot.rotation.set(0, 0, 0);
    camera.position.set(0, 0, 4.5);

    placeholder.style.display = 'none';
    hint.style.display = 'block';
    resize();
    smoothZoom = camera.position.z;
  }

  function isGeometryValid(geometry){
    const pos = geometry.attributes.position;
    if (!pos || pos.count === 0) return false;
    for (let i = 0; i < pos.array.length; i++){
      if (!isFinite(pos.array[i])) return false;
    }
    return true;
  }

  function loadFromArrayBuffer(buffer, label){
    try {
      const geometry = parseSTL(buffer);
      if (!isGeometryValid(geometry)) {
        throw new Error('coordonnées invalides — le fichier n\'a probablement pas été interprété dans le bon format (ASCII/binaire)');
      }
      displayGeometry(geometry);
      setStatus('Modèle chargé : ' + label + ' (' + (geometry.attributes.position.count/3) + ' triangles)', 'ok');
    } catch (err){
      console.error(err);
      setStatus('Erreur de lecture : ' + err.message, 'error');
    }
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setStatus('Lecture de ' + file.name + '...');
    const reader = new FileReader();
    reader.onload = ev => loadFromArrayBuffer(ev.target.result, file.name);
    reader.onerror = () => setStatus('Impossible de lire le fichier.', 'error');
    reader.readAsArrayBuffer(file);
  });

  // ---------- Suivi de la main (MediaPipe Hands) ----------
  const handToggleBtn = document.getElementById('handToggleBtn');
  const handPreview = document.getElementById('handPreview');
  const handStatus = document.getElementById('handStatus');
  const handVideo = document.getElementById('handVideo');

  let handTrackingOn = false;
  let mpCamera = null;
  let hands = null;

  // Amplitude de rotation appliquée par frame quand une direction est pointée (radians).
  const ROTATION_SPEED = 0.045;
  // Zone morte : en dessous de cette inclinaison normalisée, on considère que la main
  // est neutre (pas de rotation), pour éviter les tremblements involontaires.
  const DEADZONE = 0.22;
  // Bornes du zoom (distance caméra). Plus petit = plus proche/gros.
  const ZOOM_NEAR = 1.8;
  const ZOOM_FAR = 7.5;
  // Bornes de l'écart pouce-index (normalisé par la taille de la main) pour le zoom.
  const PINCH_CLOSED = 0.4;
  const PINCH_OPEN = 1.6;
  const ZOOM_SMOOTHING = 0.15;
  let smoothZoom = 4.5;

  function dist2D(a, b){
    const dx = a.x - b.x, dy = a.y - b.y;
    return Math.sqrt(dx*dx + dy*dy);
  }
  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
  function mapRange(v, inMin, inMax, outMin, outMax){
    const t = clamp((v - inMin) / (inMax - inMin), 0, 1);
    return outMin + t * (outMax - outMin);
  }

  function onHandResults(results){
    const found = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;
    handStatus.textContent = found ? 'Main détectée' : "Recherche d'une main...";
    handStatus.classList.toggle('found', found);
    if (!found) return;

    const lm = results.multiHandLandmarks[0];
    const wrist = lm[0], midMcp = lm[9], midTip = lm[12], thumbTip = lm[4], indexTip = lm[8];
    const handSize = dist2D(wrist, midMcp) || 0.0001;

    // Direction pointée par les doigts par rapport au poignet (comme un manche à balai).
    // On inverse l'axe X car l'aperçu vidéo est affiché en miroir.
    const dx = -(midTip.x - wrist.x) / handSize;
    const dy = (midTip.y - wrist.y) / handSize;

    // On ne retient que l'axe dominant, pour que "gauche/droite" et "haut/bas"
    // restent des mouvements clairs et non ambigus.
    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > DEADZONE) {
        window.nudgeModelRotation(0, Math.sign(dx) * ROTATION_SPEED);
      }
    } else {
      if (Math.abs(dy) > DEADZONE) {
        window.nudgeModelRotation(Math.sign(dy) * ROTATION_SPEED, 0);
      }
    }

    // Zoom : écart normalisé entre le pouce et l'index.
    const pinch = dist2D(thumbTip, indexTip) / handSize;
    const targetZoom = mapRange(pinch, PINCH_CLOSED, PINCH_OPEN, ZOOM_FAR, ZOOM_NEAR);
    smoothZoom += (targetZoom - smoothZoom) * ZOOM_SMOOTHING;
    window.setModelZoom(smoothZoom);
  }

  async function startHandTracking(){
    if (typeof Hands === 'undefined' || typeof Camera === 'undefined'){
      setStatus('Librairie de suivi de la main indisponible (vérifie ta connexion internet).', 'error');
      return;
    }
    try {
      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.5
      });
      hands.onResults(onHandResults);

      mpCamera = new Camera(handVideo, {
        onFrame: async () => { await hands.send({ image: handVideo }); },
        width: 320,
        height: 240
      });
      await mpCamera.start();

      handTrackingOn = true;
      handPreview.classList.add('on');
      handStatus.classList.add('on');
      handToggleBtn.textContent = '✋ Désactiver le suivi de la main';
      setStatus('Suivi de la main activé.', 'ok');
    } catch (err){
      console.error(err);
      setStatus("Impossible d'accéder à la caméra : " + err.message + '. Essaie d\'ouvrir ce fichier via une adresse https:// ou file:// plutôt que content://.', 'error');
    }
  }

  function stopHandTracking(){
    if (mpCamera) mpCamera.stop();
    if (handVideo.srcObject){
      handVideo.srcObject.getTracks().forEach(t => t.stop());
    }
    handTrackingOn = false;
    handPreview.classList.remove('on');
    handStatus.classList.remove('on', 'found');
    handToggleBtn.textContent = '🖐️ Activer le suivi de la main';
    setStatus('Suivi de la main désactivé.');
  }

  handToggleBtn.addEventListener('click', () => {
    if (handTrackingOn) stopHandTracking();
    else startHandTracking();
  });

})();
</script>
</body>
</html>
