<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Visualiseur STL 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg: #0b0d10;
    --panel: #14171c;
    --line: #262b33;
    --accent: #4fd1c5;
    --text: #e8ecef;
    --muted: #8a93a1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }

  #viewer { flex: 1; position: relative; touch-action: none; min-height: 200px; }
  #viewer canvas { display: block; width: 100%; height: 100%; }

  #placeholder {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; text-align: center; padding: 30px;
  }
  #placeholder .icon { font-size: 34px; opacity: 0.5; }
  #placeholder p { color: var(--muted); font-size: 13px; max-width: 260px; line-height: 1.5; margin: 0; }

  #hint {
    position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
    font-size: 11px; color: var(--muted); pointer-events: none; opacity: 0.8;
  }

  footer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  }

  /* Bouton principal = un vrai <label for="fileInput">.
     C'est le navigateur lui-même qui ouvre le sélecteur de fichiers natif :
     pas de JS requis pour déclencher l'action, donc rien qui puisse être bloqué. */
  .btn {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--accent);
    color: #06201d;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:active { opacity: 0.75; }

  #fileInput {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0; padding: 0; margin: -1px;
  }

  #status { font-size: 12px; color: var(--muted); padding-top: 10px; text-align: center; min-height: 14px; }
  #status.error { color: #f28b82; }
  #status.ok { color: var(--accent); }

  #handPreview {
    position: absolute; top: 10px; right: 10px;
    width: 90px; height: 68px; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--line); opacity: 0; transition: opacity 0.2s;
    background: #000;
  }
  #handPreview.on { opacity: 1; }
  #handPreview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #handStatus {
    position: absolute; top: 82px; right: 10px; font-size: 10px; padding: 3px 6px;
    border-radius: 6px; background: rgba(0,0,0,0.5); color: var(--muted); opacity: 0;
  }
  #handStatus.on { opacity: 1; }
  #handStatus.found { color: var(--accent); }

  .btn.secondary { background: #1b1f26; color: var(--text); margin-top: 8px; }
</style>
</head>
<body>
<div id="app">

  <div id="viewer">
    <div id="placeholder">
      <div class="icon">◇</div>
      <p>Aucun modèle chargé.<br>Touche le bouton en bas pour choisir un fichier .stl sur ton téléphone.</p>
    </div>
    <div id="hint" style="display:none;">Glisse pour tourner l'objet · pince pour zoomer</div>
    <div id="handPreview"><video id="handVideo" autoplay playsinline muted></video></div>
    <div id="handStatus">Recherche d'une main...</div>
  </div>

  <footer>
    <label class="btn" for="fileInput">📂 Choisir un fichier .stl</label>
    <input type="file" id="fileInput" accept=".stl,application/sla,application/vnd.ms-pki.stl,model/stl,*/*">
    <button class="btn secondary" id="handToggleBtn">🖐️ Activer le suivi de la main</button>
    <div id="status"></div>
  </footer>

</div>

<script>
(function(){
  const viewerEl = document.getElementById('viewer');
  const placeholder = document.getElementById('placeholder');
  const hint = document.getElementById('hint');
  const statusEl = document.getElementById('status');
  const fileInput = document.getElementById('fileInput');

  function setStatus(msg, kind){
    statusEl.textContent = msg || '';
    statusEl.className = kind || '';
  }
  window.setStatus = setStatus;

  // Confirme tout de suite que le JS tourne bien, pour écarter ce doute en cas de souci.
  setStatus('Prêt. En attente d\'un fichier.');

  // ---------- Three.js ----------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 5000);
  camera.position.set(0, 0, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  viewerEl.appendChild(renderer.domElement);

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
  keyLight.position.set(3, 5, 4);
  scene.add(keyLight);
  const fill = new THREE.DirectionalLight(0xffffff, 0.4);
  fill.position.set(-4, -2, -3);
  scene.add(fill);
  scene.add(new THREE.AmbientLight(0x404040, 1.2));

  // Pivot = objet qui sera piloté plus tard par la détection de la main.
  const pivot = new THREE.Group();
  scene.add(pivot);
  let currentMesh = null;

  function resize(){
    const w = viewerEl.clientWidth, h = viewerEl.clientHeight;
    if (w === 0 || h === 0) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  if (window.ResizeObserver) {
    new ResizeObserver(resize).observe(viewerEl);
  }
  resize();
  // Le canevas peut valoir 0x0 à l'ouverture avant que la mise en page mobile
  // se stabilise (barre d'adresse, safe-area...) : on retente à plusieurs reprises.
  [50, 150, 300, 600, 1000].forEach(t => setTimeout(resize, t));

  let flipAnimation = null; // { startRotX, targetRotX, startTime, duration }
  let lastInteractionTime = performance.now();
  let baseZoom = 4.5;
  // Après ce délai d'inactivité (ms), l'objet revient en douceur à sa position/rotation/zoom d'origine.
  const RETURN_IDLE_MS = 3000;
  const RETURN_LERP = 0.05;
  function markInteraction(){ lastInteractionTime = performance.now(); }

  function animate(){
    requestAnimationFrame(animate);
    if (flipAnimation) {
      const t = Math.min(1, (performance.now() - flipAnimation.startTime) / flipAnimation.duration);
      const eased = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; // easeInOutQuad
      pivot.rotation.x = flipAnimation.startRotX + (flipAnimation.targetRotX - flipAnimation.startRotX) * eased;
      if (t >= 1) flipAnimation = null;
    } else if (!dragging && performance.now() - lastInteractionTime > RETURN_IDLE_MS) {
      pivot.rotation.x += (0 - pivot.rotation.x) * RETURN_LERP;
      pivot.rotation.y += (0 - pivot.rotation.y) * RETURN_LERP;
      pivot.position.x += (0 - pivot.position.x) * RETURN_LERP;
      pivot.position.y += (0 - pivot.position.y) * RETURN_LERP;
      camera.position.z += (baseZoom - camera.position.z) * RETURN_LERP;
    }
    renderer.render(scene, camera);
  }
  animate();

  // Déclenche une rotation animée de 180° (pour voir le dessous de l'objet),
  // appelée par le suivi de la main quand on détecte un retournement du poignet.
  window.flipModel180 = function(){
    if (flipAnimation) return; // déjà en cours, on ignore
    markInteraction();
    flipAnimation = { startRotX: pivot.rotation.x, targetRotX: pivot.rotation.x + Math.PI, startTime: performance.now(), duration: 500 };
  };

  // Rotation tactile / souris (en attendant le tracking de la main)
  let dragging = false, lastX = 0, lastY = 0, pinchDist = null;

  function down(x, y){ dragging = true; lastX = x; lastY = y; markInteraction(); }
  function move(x, y){
    if (!dragging) return;
    pivot.rotation.y += (x - lastX) * 0.008;
    pivot.rotation.x += (y - lastY) * 0.008;
    lastX = x; lastY = y;
    markInteraction();
  }
  viewerEl.addEventListener('mousedown', e => down(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
  window.addEventListener('mouseup', () => dragging = false);

  viewerEl.addEventListener('touchstart', e => {
    if (e.touches.length === 1) down(e.touches[0].clientX, e.touches[0].clientY);
    else if (e.touches.length === 2) pinchDist = dist(e.touches);
  }, { passive: true });
  viewerEl.addEventListener('touchmove', e => {
    if (e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY);
    else if (e.touches.length === 2) {
      const d = dist(e.touches);
      if (pinchDist) camera.position.z = Math.max(0.5, camera.position.z - (d - pinchDist) * 0.01);
      pinchDist = d;
    }
  }, { passive: true });
  viewerEl.addEventListener('touchend', () => { dragging = false; pinchDist = null; });
  function dist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }

  // Points d'entrée pour le futur module de détection de la main.
  window.setModelRotation = (x, y) => { markInteraction(); pivot.rotation.x = x; pivot.rotation.y = y; };
  window.nudgeModelRotation = (dx, dy) => { markInteraction(); pivot.rotation.x += dx; pivot.rotation.y += dy; };
  window.setModelZoom = z => { markInteraction(); camera.position.z = Math.max(0.3, z); };
  window.nudgeModelPosition = (dx, dy) => { markInteraction(); pivot.position.x += dx; pivot.position.y += dy; };
  // Simule un doigt sur l'écran (utilisé par le suivi de la main pour faire tourner
  // l'objet exactement comme un glissé tactile normal).
  window.virtualTouchStart = (x, y) => down(x, y);
  window.virtualTouchMove = (x, y) => move(x, y);
  window.virtualTouchEnd = () => { dragging = false; };

  // ---------- Parseur STL maison (binaire + ASCII) ----------
  function parseSTL(buffer){
    return detectAscii(buffer) ? parseAscii(buffer) : parseBinary(buffer);
  }
  function detectAscii(buffer){
    if (buffer.byteLength < 84) return true;
    const dv = new DataView(buffer);
    const triCount = dv.getUint32(80, true);
    const expectedBinarySize = 84 + triCount * 50;
    // Correspondance exacte de taille => quasi certain que c'est du binaire,
    // même si l'entête contient le mot "solid" (fréquent avec certains exports CAO).
    if (expectedBinarySize === buffer.byteLength) return false;
    // Sinon on regarde si le contenu ressemble à du texte lisible (ASCII STL).
    const sample = new Uint8Array(buffer, 0, Math.min(buffer.byteLength, 4096));
    let printable = 0;
    for (let i = 0; i < sample.length; i++){
      const c = sample[i];
      if (c === 9 || c === 10 || c === 13 || (c >= 32 && c <= 126)) printable++;
    }
    return (printable / sample.length) > 0.95;
  }
  function parseBinary(buffer){
    const dv = new DataView(buffer);
    const triCount = dv.getUint32(80, true);
    const positions = new Float32Array(triCount * 9);
    const normals = new Float32Array(triCount * 9);
    let o = 84;
    for (let i = 0; i < triCount; i++){
      const nx = dv.getFloat32(o, true), ny = dv.getFloat32(o+4, true), nz = dv.getFloat32(o+8, true);
      o += 12;
      for (let v = 0; v < 3; v++){
        const idx = i*9 + v*3;
        positions[idx] = dv.getFloat32(o, true);
        positions[idx+1] = dv.getFloat32(o+4, true);
        positions[idx+2] = dv.getFloat32(o+8, true);
        normals[idx]=nx; normals[idx+1]=ny; normals[idx+2]=nz;
        o += 12;
      }
      o += 2;
    }
    return build(positions, normals);
  }
  function parseAscii(buffer){
    const text = new TextDecoder().decode(buffer);
    const re = /vertex\s+([\-0-9.eE]+)\s+([\-0-9.eE]+)\s+([\-0-9.eE]+)/g;
    const positions = [];
    let m;
    while ((m = re.exec(text)) !== null) positions.push(+m[1], +m[2], +m[3]);
    return build(new Float32Array(positions), null);
  }
  function build(positions, normals){
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    if (normals) geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    else geo.computeVertexNormals();
    return geo;
  }

  function displayGeometry(geometry){
    if (currentMesh){
      pivot.remove(currentMesh);
      currentMesh.geometry.dispose();
      currentMesh.material.dispose();
    }
    geometry.computeBoundingBox();
    const center = new THREE.Vector3();
    geometry.boundingBox.getCenter(center);
    geometry.translate(-center.x, -center.y, -center.z);

    const size = new THREE.Vector3();
    geometry.boundingBox.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const scale = 2 / maxDim;
    geometry.scale(scale, scale, scale);

    const material = new THREE.MeshStandardMaterial({ color: 0x4fd1c5, metalness: 0.15, roughness: 0.55, side: THREE.DoubleSide });
    currentMesh = new THREE.Mesh(geometry, material);
    pivot.add(currentMesh);
    pivot.rotation.set(0, 0, 0);
    pivot.position.set(0, 0, 0);
    camera.position.set(0, 0, 4.5);

    placeholder.style.display = 'none';
    hint.style.display = 'block';
    resize();
    smoothZoom = camera.position.z;
    baseZoom = camera.position.z;
    lastInteractionTime = performance.now();
  }

  function isGeometryValid(geometry){
    const pos = geometry.attributes.position;
    if (!pos || pos.count === 0) return false;
    for (let i = 0; i < pos.array.length; i++){
      if (!isFinite(pos.array[i])) return false;
    }
    return true;
  }

  function loadFromArrayBuffer(buffer, label){
    try {
      const geometry = parseSTL(buffer);
      if (!isGeometryValid(geometry)) {
        throw new Error('coordonnées invalides — le fichier n\'a probablement pas été interprété dans le bon format (ASCII/binaire)');
      }
      displayGeometry(geometry);
      setStatus('Modèle chargé : ' + label + ' (' + (geometry.attributes.position.count/3) + ' triangles)', 'ok');
    } catch (err){
      console.error(err);
      setStatus('Erreur de lecture : ' + err.message, 'error');
    }
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setStatus('Lecture de ' + file.name + '...');
    const reader = new FileReader();
    reader.onload = ev => loadFromArrayBuffer(ev.target.result, file.name);
    reader.onerror = () => setStatus('Impossible de lire le fichier.', 'error');
    reader.readAsArrayBuffer(file);
  });

})();
</script>

<!-- Suivi de la main : module séparé utilisant l'API MediaPipe Tasks Vision (HandLandmarker),
     la version actuellement maintenue par Google — plus fiable que l'ancienne API "Hands". -->
<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const handToggleBtn = document.getElementById('handToggleBtn');
const handPreview = document.getElementById('handPreview');
const handStatus = document.getElementById('handStatus');
const handVideo = document.getElementById('handVideo');

let handLandmarker = null;
let handTrackingOn = false;
let frameCount = 0;
let stream = null;
let isFist = false;
let lastPalm = null;
// Délai avant réinitialisation complète si la main disparaît du champ (millisecondes).
const HAND_LOST_RESET_MS = 3000;
let lastSeenTime = 0;

// Bornes du zoom (distance caméra). Plus petit = plus proche/gros.
const ZOOM_NEAR = 1.8;
const ZOOM_FAR = 7.5;
// Bornes de l'écart pouce-index (normalisé par la taille de la main) pour le zoom.
const PINCH_CLOSED = 0.4;
const PINCH_OPEN = 1.6;
const ZOOM_SMOOTHING = 0.15;
let smoothZoom = 4.5;
// Sensibilité du glissement quand le poing est fermé.
const PAN_SENSITIVITY = 6;
// Nombre de frames consécutives identiques requises avant de changer de mode
// (évite que ça bascule sans arrêt entre poing/pointage à cause du bruit de détection).
const GESTURE_STABILITY_FRAMES = 3;

function dist2D(a, b){
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx*dx + dy*dy);
}
function dist3D(a, b){
  const dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
  return Math.sqrt(dx*dx + dy*dy + dz*dz);
}
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function mapRange(v, inMin, inMax, outMin, outMax){
  const t = clamp((v - inMin) / (inMax - inMin), 0, 1);
  return outMin + t * (outMax - outMin);
}

// Un doigt est "tendu" si son bout est plus loin du poignet que son articulation
// du milieu (PIP), calculé en coordonnées 3D réelles (pas juste l'image) — bien
// plus fiable quel que soit l'angle de la main face à la caméra.
function isFingerExtended(tip, pip, wrist){
  return dist3D(tip, wrist) > dist3D(pip, wrist) * 1.05;
}

const viewerEl = document.getElementById('viewer');
let wasTouching = false;
let pendingGesture = 'none';
let pendingCount = 0;
let currentGesture = 'none';
let isPointing = false;
let targetCursor = { x: 0, y: 0 };
let smoothCursor = { x: 0, y: 0 };
// Fraction du chemin parcouru vers la cible à chaque image de rendu (~60/s).
// Plus haut = plus réactif mais plus saccadé, plus bas = plus doux mais en retard.
const CURSOR_SMOOTHING = 0.4;

// Détection du retournement de la main (paume face caméra <-> dos de la main face caméra).
// Nécessite plusieurs frames stables avant de valider, pour ne déclencher que sur un
// vrai retournement volontaire du poignet, pas du bruit.
const PALM_STABILITY_FRAMES = 6;
let pendingPalmFacing = null;
let pendingPalmCount = 0;
let confirmedPalmFacing = null;

function applyGesture(imgLm, worldLm){
  const wristW = worldLm[0], thumbTipW = worldLm[4];
  const indexTipW = worldLm[8], indexPipW = worldLm[6];
  const middleTipW = worldLm[12], middlePipW = worldLm[10];
  const ringTipW = worldLm[16], ringPipW = worldLm[14];
  const pinkyTipW = worldLm[20], pinkyPipW = worldLm[18];
  const handSizeW = dist3D(wristW, worldLm[9]) || 0.0001;

  // --- Retournement de la main : normale de la paume via produit vectoriel 3D ---
  const indexMcpW = worldLm[5], pinkyMcpW = worldLm[17];
  const v1 = { x: indexMcpW.x - wristW.x, y: indexMcpW.y - wristW.y, z: indexMcpW.z - wristW.z };
  const v2 = { x: pinkyMcpW.x - wristW.x, y: pinkyMcpW.y - wristW.y, z: pinkyMcpW.z - wristW.z };
  const crossZ = v1.x * v2.y - v1.y * v2.x;
  const palmFacingNow = crossZ < 0;

  if (palmFacingNow === pendingPalmFacing) {
    pendingPalmCount++;
  } else {
    pendingPalmFacing = palmFacingNow;
    pendingPalmCount = 1;
  }
  if (pendingPalmCount >= PALM_STABILITY_FRAMES) {
    if (confirmedPalmFacing !== null && confirmedPalmFacing !== pendingPalmFacing) {
      window.flipModel180();
    }
    confirmedPalmFacing = pendingPalmFacing;
  }

  const indexOut = isFingerExtended(indexTipW, indexPipW, wristW);
  const middleOut = isFingerExtended(middleTipW, middlePipW, wristW);
  const ringOut = isFingerExtended(ringTipW, ringPipW, wristW);
  const pinkyOut = isFingerExtended(pinkyTipW, pinkyPipW, wristW);

  const rawFist = !indexOut && !middleOut && !ringOut && !pinkyOut;
  const rawPoint = indexOut && !middleOut && !ringOut && !pinkyOut;
  const rawGesture = rawFist ? 'fist' : rawPoint ? 'point' : 'none';

  // Filtre de stabilité : il faut plusieurs frames d'affilée du même geste avant
  // de changer de mode, pour éviter les à-coups dus au bruit de détection.
  if (rawGesture === pendingGesture) {
    pendingCount++;
  } else {
    pendingGesture = rawGesture;
    pendingCount = 1;
  }
  if (pendingCount >= GESTURE_STABILITY_FRAMES) {
    currentGesture = pendingGesture;
  }

  if (currentGesture === 'fist') {
    isPointing = false;
    const palm = imgLm[9];
    if (isFist && lastPalm) {
      const dxScreen = palm.x - lastPalm.x;
      const dyScreen = palm.y - lastPalm.y;
      window.nudgeModelPosition(-dxScreen * PAN_SENSITIVITY, -dyScreen * PAN_SENSITIVITY);
    }
    lastPalm = { x: palm.x, y: palm.y };
    isFist = true;
  } else {
    isFist = false;
    lastPalm = null;

    if (currentGesture === 'point') {
      const rect = viewerEl.getBoundingClientRect();
      // Le bout de l'index (coordonnées image, pas monde) donne sa position à l'écran.
      const indexTipImg = imgLm[8];
      targetCursor.x = rect.left + (1 - indexTipImg.x) * rect.width; // miroir horizontal
      targetCursor.y = rect.top + indexTipImg.y * rect.height;
      isPointing = true;
    } else {
      isPointing = false;
    }
  }

  // --- Zoom : uniquement main ouverte neutre (pas en mode pointage ni poing),
  // pour éviter un zoom involontaire quand le pouce dérive près de l'index en pointant.
  if (currentGesture === 'none') {
    const pinch = dist3D(thumbTipW, indexTipW) / handSizeW;
    const targetZoom = mapRange(pinch, PINCH_CLOSED, PINCH_OPEN, ZOOM_NEAR, ZOOM_FAR);
    smoothZoom += (targetZoom - smoothZoom) * ZOOM_SMOOTHING;
    window.setModelZoom(smoothZoom);
  }
}

// Boucle de lissage indépendante, tourne au rythme de l'affichage (~60/s) même si
// la détection de la main est plus lente : le curseur (et donc la rotation) reste fluide.
function cursorSmoothLoop(){
  if (isPointing) {
    if (!wasTouching) {
      smoothCursor.x = targetCursor.x;
      smoothCursor.y = targetCursor.y;
      window.virtualTouchStart(smoothCursor.x, smoothCursor.y);
      wasTouching = true;
    } else {
      smoothCursor.x += (targetCursor.x - smoothCursor.x) * CURSOR_SMOOTHING;
      smoothCursor.y += (targetCursor.y - smoothCursor.y) * CURSOR_SMOOTHING;
      window.virtualTouchMove(smoothCursor.x, smoothCursor.y);
    }
  } else if (wasTouching) {
    window.virtualTouchEnd();
    wasTouching = false;
  }
  requestAnimationFrame(cursorSmoothLoop);
}
requestAnimationFrame(cursorSmoothLoop);

function detectLoop(){
  if (!handTrackingOn) return;
  if (handVideo.readyState >= 2){
    frameCount++;
    const results = handLandmarker.detectForVideo(handVideo, performance.now());
    const found = results.landmarks && results.landmarks.length > 0 && results.worldLandmarks && results.worldLandmarks.length > 0;
    handStatus.textContent = found
      ? 'Main détectée'
      : "Recherche... (" + frameCount + " img, vidéo " + handVideo.videoWidth + "x" + handVideo.videoHeight + ")";
    handStatus.classList.toggle('found', found);
    if (found) {
      lastSeenTime = performance.now();
      applyGesture(results.landmarks[0], results.worldLandmarks[0]);
    } else {
      const elapsedSinceSeen = performance.now() - lastSeenTime;
      if (elapsedSinceSeen >= HAND_LOST_RESET_MS) {
        isFist = false;
        lastPalm = null;
        isPointing = false;
        pendingGesture = 'none';
        pendingCount = 0;
        currentGesture = 'none';
        pendingPalmFacing = null;
        pendingPalmCount = 0;
      }
      // Sinon (moins de 3s), on ne touche à rien : la main est peut-être juste
      // sortie du cadre un instant, l'objet reste figé dans son dernier état.
    }
  }
  requestAnimationFrame(detectLoop);
}

async function startHandTracking(){
  frameCount = 0;
  try {
    if (!handLandmarker){
      window.setStatus('Chargement du modèle de détection de la main...');
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "CPU"
        },
        runningMode: "VIDEO",
        numHands: 1
      });
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 480, height: 360 },
      audio: false
    });
    handVideo.srcObject = stream;
    await handVideo.play();

    handTrackingOn = true;
    handPreview.classList.add('on');
    handStatus.classList.add('on');
    handToggleBtn.textContent = '✋ Désactiver le suivi de la main';
    window.setStatus('Suivi de la main activé.', 'ok');
    requestAnimationFrame(detectLoop);
  } catch (err){
    console.error(err);
    window.setStatus("Erreur de suivi de la main : " + err.message, 'error');
  }
}

function stopHandTracking(){
  handTrackingOn = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  handPreview.classList.remove('on');
  handStatus.classList.remove('on', 'found');
  handToggleBtn.textContent = '🖐️ Activer le suivi de la main';
  window.setStatus('Suivi de la main désactivé.');
}

handToggleBtn.addEventListener('click', () => {
  if (handTrackingOn) stopHandTracking();
  else startHandTracking();
});
</script>
